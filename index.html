<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBanker AI — Banking Awareness & Exam Practice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #070c18; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 32px; max-width: 580px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .badge { display: inline-block; background: #0284c7; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 99px; margin-bottom: 12px; text-transform: uppercase; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }
    p.sub { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }
    .quiz-box { background: #131d35; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .q-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; color: #f8fafc; line-height: 1.4; }
    .opt-btn { display: block; width: 100%; text-align: left; padding: 12px 16px; margin-bottom: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
    .opt-btn:hover { background: #334155; border-color: #38bdf8; }
    .feedback { min-height: 24px; font-size: 0.95rem; font-weight: 600; margin-top: 12px; }
    .correct { color: #4ade80; }
    .incorrect { color: #f87171; }
    .next-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #0284c7; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; display: none; margin-top: 10px; }
    .next-btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">IBPS / SBI / RBI EXAM PREP</span>
    <h1>🏦 SmartBanker AI</h1>
    <p class="sub">High-yield banking awareness practice drills & questions.</p>

    <div class="quiz-box">
      <div id="q-text" class="q-title">Loading Question...</div>
      <div id="options-container"></div>
      <div id="feedback" class="feedback"></div>
      <button id="next-btn" class="next-btn" onclick="loadNextQuestion()">Next Question →</button>
    </div>
  </div>

  <script src="https://unknownuniversem-blip.github.io/network.js" defer></script>
  <script>
    const QUESTIONS = [
      {
        q: "Which authority determines the Repo Rate and Reverse Repo Rate in India?",
        opts: ["Securities and Exchange Board of India (SEBI)", "Monetary Policy Committee (MPC) of RBI", "Ministry of Finance", "Indian Banks' Association (IBA)"],
        ans: 1,
        exp: "The Monetary Policy Committee (MPC) of the Reserve Bank of India fixes the benchmark policy repo rate."
      },
      {
        q: "What does CTS stand for in banking clearance?",
        opts: ["Central Transfer System", "Customer Transaction Settlement", "Cheque Truncation System", "Credit Tracking Service"],
        ans: 2,
        exp: "CTS stands for Cheque Truncation System, an online image-based cheque clearing mechanism."
      },
      {
        q: "What is the maximum insurance coverage provided by DICGC per depositor per bank?",
        opts: ["₹1,00,000", "₹2,00,000", "₹5,00,000", "₹10,00,000"],
        ans: 2,
        exp: "DICGC insures all bank deposits up to ₹5 Lakh per depositor per bank."
      }
    ];

    let currentIdx = 0;
    function renderQuestion() {
      const item = QUESTIONS[currentIdx];
      document.getElementById('q-text').innerText = (currentIdx + 1) + ". " + item.q;
      const optsBox = document.getElementById('options-container');
      optsBox.innerHTML = '';
      document.getElementById('feedback').innerText = '';
      document.getElementById('next-btn').style.display = 'none';

      item.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(idx);
        optsBox.appendChild(btn);
      });
    }

    function selectAnswer(chosenIdx) {
      const item = QUESTIONS[currentIdx];
      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      const fb = document.getElementById('feedback');
      if (chosenIdx === item.ans) {
        fb.className = 'feedback correct';
        fb.innerText = "✔ Correct! " + item.exp;
      } else {
        fb.className = 'feedback incorrect';
        fb.innerText = "✖ Incorrect. " + item.exp;
      }
      document.getElementById('next-btn').style.display = 'block';
    }

    function loadNextQuestion() {
      currentIdx = (currentIdx + 1) % QUESTIONS.length;
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
