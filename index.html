<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBanker AI — Chapterwise PYQ Practice Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070c18;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 14px 80px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 24px;
      max-width: 980px;
      width: 100%;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.6rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tier-toggle {
      display: flex;
      background: #070c18;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }
    .tier-btn {
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tier-btn.active {
      background: #0284c7;
      color: #fff;
    }
    .scroll-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
      scrollbar-width: thin;
    }
    .pill-btn {
      white-space: nowrap;
      padding: 7px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .pill-btn:hover { border-color: #38bdf8; }
    .pill-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }
    .chapter-bar .pill-btn.active {
      background: #38bdf8;
      color: #070c18;
      font-weight: 700;
    }

    /* Question Palette (Testbook/Guidely style) */
    .palette-container {
      background: #0b1329;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      max-height: 110px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
      gap: 6px;
    }
    .palette-btn {
      height: 32px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .palette-btn:hover { border-color: #38bdf8; }
    .palette-btn.current { outline: 2px solid #38bdf8; outline-offset: 1px; }
    .palette-btn.correct { background: #15803d; border-color: #22c55e; color: #fff; }
    .palette-btn.incorrect { background: #b91c1c; border-color: #ef4444; color: #fff; }

    .quiz-box {
      background: #131d35;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 22px;
      min-height: 270px;
    }
    .meta-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .exam-tag {
      background: #b91c1c;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .exam-tag .exam-year {
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 7px;
      border-radius: 4px;
      color: #facc15;
    }
    .q-counter {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 600;
    }

    /* Common Context / Passage / DI Block */
    .context-box {
      background: #091224;
      border-left: 4px solid #38bdf8;
      border-radius: 6px;
      padding: 14px 18px;
      margin-bottom: 18px;
      color: #94a3b8;
      font-size: 0.92rem;
      line-height: 1.6;
      white-space: pre-line;
    }

    .q-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f8fafc;
      line-height: 1.55;
      margin-bottom: 18px;
      white-space: pre-line;
    }
    .opt-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      margin-bottom: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.94rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .opt-btn:hover:not(:disabled) {
      background: #27354f;
      border-color: #38bdf8;
    }
    .opt-btn.user-correct { background: #166534 !important; border-color: #22c55e !important; }
    .opt-btn.user-wrong { background: #991b1b !important; border-color: #f87171 !important; }

    .feedback {
      min-height: 24px;
      font-size: 0.92rem;
      font-weight: 600;
      margin-top: 14px;
      line-height: 1.45;
    }
    .correct { color: #4ade80; }
    .incorrect { color: #f87171; }
    
    .nav-btn-row {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }
    .nav-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .nav-btn:hover { background: #0369a1; }
    .nav-btn:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
    }
    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 180px;
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <h1>🏦 SmartBanker AI</h1>
      <div class="tier-toggle">
        <button class="tier-btn active" id="btn-pre" onclick="setTier('prelims')">Prelims</button>
        <button class="tier-btn" id="btn-mains" onclick="setTier('mains')">Mains</button>
      </div>
    </div>

    <!-- Subject Selector -->
    <div class="scroll-row" id="subject-list"></div>

    <!-- Chapter Selector -->
    <div class="scroll-row chapter-bar" id="chapter-list"></div>

    <!-- 1-100 Question Palette Grid -->
    <div class="palette-container" id="palette-grid"></div>

    <!-- Quiz Question Area -->
    <div class="quiz-box">
      <div class="meta-top-bar">
        <div class="exam-tag" id="exam-tag">
          <span id="exam-name">IBPS PO</span>
          <span class="exam-year" id="exam-year">2025</span>
        </div>
        <div class="q-counter" id="q-counter">Question 1 of 100</div>
      </div>

      <div id="content-area">
        <div id="context-box" class="context-box" style="display:none;"></div>
        <div id="q-text" class="q-title">Loading Question...</div>
        <div id="options-container"></div>
        <div id="feedback" class="feedback"></div>
      </div>

      <div class="nav-btn-row">
        <button id="prev-btn" class="nav-btn" onclick="prevQuestion()">← Previous Question</button>
        <button id="next-btn" class="nav-btn" onclick="nextQuestion()">Next Question →</button>
      </div>
    </div>
  </div>

  <script src="https://unknownuniversem-blip.github.io/network.js" defer></script>
  <script>
    let manifestData = null;
    let currentTier = 'prelims';
    let currentSubject = '';
    let currentChapterObj = null;
    let currentQuestions = [];
    let currentQIdx = 0;
    let userAnswers = {};

    fetch('data/manifest.json')
      .then(r => r.json())
      .then(d => {
        manifestData = d;
        setTier('prelims');
      })
      .catch(() => {
        document.getElementById('q-text').innerText = "Failed to load syllabus. Please refresh.";
      });

    function setTier(tier) {
      currentTier = tier;
      document.getElementById('btn-pre').classList.toggle('active', tier === 'prelims');
      document.getElementById('btn-mains').classList.toggle('active', tier === 'mains');
      
      const subjects = Object.keys(manifestData[currentTier]);
      currentSubject = subjects[0];
      renderSubjects();
    }

    function renderSubjects() {
      const container = document.getElementById('subject-list');
      container.innerHTML = '';
      const subjects = Object.keys(manifestData[currentTier]);

      subjects.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn' + (sub === currentSubject ? ' active' : '');
        btn.innerText = sub;
        btn.onclick = () => {
          currentSubject = sub;
          renderSubjects();
        };
        container.appendChild(btn);
      });

      renderChapters();
    }

    function renderChapters() {
      const container = document.getElementById('chapter-list');
      container.innerHTML = '';
      const chapters = manifestData[currentTier][currentSubject] || [];
      currentChapterObj = chapters[0] || null;

      chapters.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn' + (currentChapterObj && ch.chapter === currentChapterObj.chapter ? ' active' : '');
        btn.innerText = `${ch.chapter} (${ch.count})`;
        btn.onclick = () => {
          currentChapterObj = ch;
          document.querySelectorAll('#chapter-list .pill-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadChapter(ch.file);
        };
        container.appendChild(btn);
      });

      if (currentChapterObj) {
        loadChapter(currentChapterObj.file);
      }
    }

    function loadChapter(filePath) {
      userAnswers = {};
      currentQIdx = 0;
      document.getElementById('content-area').innerHTML = '<div class="loader">⚡ Loading Chapter PYQs...</div>';

      fetch(filePath)
        .then(r => r.json())
        .then(data => {
          currentQuestions = data;
          buildPalette();
          renderQuestion();
        })
        .catch(() => {
          document.getElementById('content-area').innerHTML = '<div class="loader" style="color:#f87171">Error loading chapter questions.</div>';
        });
    }

    function buildPalette() {
      const grid = document.getElementById('palette-grid');
      grid.innerHTML = '';
      for (let i = 0; i < currentQuestions.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'palette-btn' + (i === currentQIdx ? ' current' : '');
        btn.id = `palette-btn-${i}`;
        btn.innerText = i + 1;
        btn.onclick = () => {
          currentQIdx = i;
          renderQuestion();
        };
        grid.appendChild(btn);
      }
    }

    function updatePaletteStatus(idx, isCorrect) {
      const btn = document.getElementById(`palette-btn-${idx}`);
      if (btn) {
        btn.classList.remove('correct', 'incorrect');
        btn.classList.add(isCorrect ? 'correct' : 'incorrect');
      }
    }

    function renderQuestion() {
      const item = currentQuestions[currentQIdx];
      if (!item) return;

      document.getElementById('exam-name').innerText = item.exam;
      document.getElementById('exam-year').innerText = item.year;
      document.getElementById('q-counter').innerText = `Question ${currentQIdx + 1} of ${currentQuestions.length}`;

      document.querySelectorAll('.palette-btn').forEach((b, i) => {
        b.classList.toggle('current', i === currentQIdx);
      });

      const targetPaletteBtn = document.getElementById(`palette-btn-${currentQIdx}`);
      if (targetPaletteBtn) {
        targetPaletteBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }

      const contentBox = document.getElementById('content-area');
      const hasContext = item.context && item.context.trim().length > 0;
      
      contentBox.innerHTML = `
        <div id="context-box" class="context-box" style="${hasContext ? 'display:block;' : 'display:none;'}">${item.context || ''}</div>
        <div class="q-title">${currentQIdx + 1}. ${item.q}</div>
        <div id="options-container"></div>
        <div id="feedback" class="feedback"></div>
      `;

      const optsContainer = document.getElementById('options-container');
      const hasAnswered = userAnswers.hasOwnProperty(currentQIdx);

      item.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        
        if (hasAnswered) {
          btn.disabled = true;
          const chosen = userAnswers[currentQIdx];
          if (idx === item.ans) btn.classList.add('user-correct');
          if (idx === chosen && chosen !== item.ans) btn.classList.add('user-wrong');
        } else {
          btn.onclick = () => selectOption(idx);
        }
        optsContainer.appendChild(btn);
      });

      const fb = document.getElementById('feedback');
      if (hasAnswered) {
        const chosen = userAnswers[currentQIdx];
        if (chosen === item.ans) {
          fb.className = 'feedback correct';
          fb.innerText = "✔ Correct! " + item.exp;
        } else {
          fb.className = 'feedback incorrect';
          fb.innerText = "✖ Incorrect. Solution: " + item.exp;
        }
      }

      document.getElementById('prev-btn').disabled = (currentQIdx === 0);
      document.getElementById('next-btn').disabled = (currentQIdx === currentQuestions.length - 1);
    }

    function selectOption(chosenIdx) {
      const item = currentQuestions[currentQIdx];
      userAnswers[currentQIdx] = chosenIdx;
      updatePaletteStatus(currentQIdx, chosenIdx === item.ans);
      renderQuestion();
    }

    function nextQuestion() {
      if (currentQIdx < currentQuestions.length - 1) {
        currentQIdx++;
        renderQuestion();
      }
    }

    function prevQuestion() {
      if (currentQIdx > 0) {
        currentQIdx--;
        renderQuestion();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextQuestion();
      if (e.key === 'ArrowLeft') prevQuestion();
    });
  </script>
</body>
</html>
