            }
          ],
          "Cybersecurity & Banking Threats": [
            {
              exam: "IBPS RRB PO Mains", year: "2024",
              q: "What type of attack manipulates DNS caches to divert banking customers from legitimate websites to fraudulent cloned portals?",
              opts: ["Phishing", "DNS Spoofing / Pharming", "Man-in-the-Middle", "SQL Injection"], ans: 1,
              exp: "DNS Cache Poisoning / Pharming redirects traffic to a spoofed server without the user typing an incorrect address."
            }
          ],
          "DBMS & Core Banking Architecture": [
            {
              exam: "SBI PO Mains", year: "2023",
              q: "Which ACID property in database management ensures that banking transactions are completely processed or rolled back entirely?",
              opts: ["Atomicity", "Consistency", "Isolation", "Durability"], ans: 0,
              exp: "Atomicity enforces the 'all-or-nothing' rule for multi-step banking ledger debit and credit updates."
            }
          ]
        }
      }
    };

    let currentTier = 'pre';
    let currentSubject = '';
    let currentChapter = '';
    let currentQIdx = 0;

    function setTier(tier) {
      currentTier = tier;
      document.getElementById('btn-pre').classList.toggle('active', tier === 'pre');
      document.getElementById('btn-mains').classList.toggle('active', tier === 'mains');
      
      const subjects = Object.keys(CHAPTER_DATA[currentTier]);
      currentSubject = subjects[0];
      renderSubjects();
    }

    function renderSubjects() {
      const subContainer = document.getElementById('subject-list');
      subContainer.innerHTML = '';
      const subjects = Object.keys(CHAPTER_DATA[currentTier]);

      subjects.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn' + (sub === currentSubject ? ' active' : '');
        btn.innerText = sub;
        btn.onclick = () => {
          currentSubject = sub;
          renderSubjects();
        };
        subContainer.appendChild(btn);
      });

      renderChapters();
    }

    function renderChapters() {
      const chContainer = document.getElementById('chapter-list');
      chContainer.innerHTML = '';
      const chapters = Object.keys(CHAPTER_DATA[currentTier][currentSubject] || {});
      
      if (chapters.length > 0) {
        currentChapter = chapters[0];
      } else {
        currentChapter = '';
      }

      chapters.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn' + (ch === currentChapter ? ' active' : '');
        btn.innerText = ch;
        btn.onclick = () => {
          currentChapter = ch;
          document.querySelectorAll('#chapter-list .pill-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentQIdx = 0;
          loadQuestion();
        };
        chContainer.appendChild(btn);
      });

      currentQIdx = 0;
      loadQuestion();
    }

    function loadQuestion() {
      const qList = (CHAPTER_DATA[currentTier][currentSubject] && CHAPTER_DATA[currentTier][currentSubject][currentChapter]) || [];
      const item = qList[currentQIdx];

      document.getElementById('feedback').innerText = '';
      document.getElementById('prev-btn').style.display = currentQIdx > 0 ? 'block' : 'none';
      document.getElementById('next-btn').style.display = 'none';

      if (!item) {
        document.getElementById('exam-name').innerText = "ARCHIVE";
        document.getElementById('exam-year').innerText = "2026";
        document.getElementById('q-counter').innerText = "0 of 0";
        document.getElementById('q-text').innerText = "Select a valid chapter from above.";
        document.getElementById('options-container').innerHTML = '';
        return;
      }

      document.getElementById('exam-name').innerText = item.exam;
      document.getElementById('exam-year').innerText = item.year;
      document.getElementById('q-counter').innerText = `Question ${currentQIdx + 1} of ${qList.length}`;
      document.getElementById('q-text').innerText = item.q;

      const optsBox = document.getElementById('options-container');
      optsBox.innerHTML = '';

      item.opts.forEach((opt, idx) => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = opt;
        b.onclick = () => handleAnswer(idx);
        optsBox.appendChild(b);
      });
    }

    function handleAnswer(selected) {
      const qList = CHAPTER_DATA[currentTier][currentSubject][currentChapter];
      const item = qList[currentQIdx];
      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      const fb = document.getElementById('feedback');

      if (selected === item.ans) {
        fb.className = 'feedback correct';
        fb.innerText = "✔ Correct! " + item.exp;
      } else {
        fb.className = 'feedback incorrect';
        fb.innerText = "✖ Incorrect. Solution: " + item.exp;
      }

      if (currentQIdx < qList.length - 1) {
        document.getElementById('next-btn').style.display = 'block';
      }
    }

    function nextQuestion() {
      currentQIdx++;
      loadQuestion();
    }

    function prevQuestion() {
      if (currentQIdx > 0) {
        currentQIdx--;
        loadQuestion();
      }
    }

    // Init
    setTier('pre');
  </script>
</body>
</html>
