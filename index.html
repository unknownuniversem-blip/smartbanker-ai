<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBanker AI — Modular 5-Year Chapterwise PYQ Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070c18;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px 80px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 26px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.6rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tier-toggle {
      display: flex;
      background: #070c18;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }
    .tier-btn {
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tier-btn.active {
      background: #0284c7;
      color: #fff;
    }
    .scroll-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
      scrollbar-width: thin;
    }
    .pill-btn {
      white-space: nowrap;
      padding: 7px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .pill-btn:hover { border-color: #38bdf8; }
    .pill-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }
    .chapter-bar .pill-btn.active {
      background: #38bdf8;
      color: #070c18;
      font-weight: 700;
    }
    .quiz-box {
      background: #131d35;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 22px;
      position: relative;
      margin-top: 8px;
      min-height: 260px;
    }
    .meta-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .exam-tag {
      background: #b91c1c;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .exam-tag .exam-year {
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 7px;
      border-radius: 4px;
      color: #facc15;
    }
    .q-jump-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .q-counter {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .q-select {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
    }
    .q-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f8fafc;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .opt-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      margin-bottom: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.94rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .opt-btn:hover:not(:disabled) {
      background: #27354f;
      border-color: #38bdf8;
    }
    .feedback {
      min-height: 24px;
      font-size: 0.92rem;
      font-weight: 600;
      margin-top: 14px;
      line-height: 1.45;
    }
    .correct { color: #4ade80; }
    .incorrect { color: #f87171; }
    .nav-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .nav-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .nav-btn:hover { background: #0369a1; }
    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 140px;
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <h1>🏦 SmartBanker AI</h1>
      <div class="tier-toggle">
        <button class="tier-btn active" id="btn-pre" onclick="setTier('prelims')">Prelims</button>
        <button class="tier-btn" id="btn-mains" onclick="setTier('mains')">Mains</button>
      </div>
    </div>

    <div class="scroll-row" id="subject-list"></div>
    <div class="scroll-row chapter-bar" id="chapter-list"></div>

    <div class="quiz-box">
      <div class="meta-top-bar">
        <div class="exam-tag" id="exam-tag">
          <span id="exam-name">IBPS PO</span>
          <span class="exam-year" id="exam-year">2025</span>
        </div>
        <div class="q-jump-wrap">
          <span class="q-counter" id="q-counter">Q 1 of 50</span>
          <select id="jump-select" class="q-select" onchange="jumpToQuestion(this.value)"></select>
        </div>
      </div>

      <div id="content-area">
        <div id="q-text" class="q-title">Loading Question...</div>
        <div id="options-container"></div>
        <div id="feedback" class="feedback"></div>
        <div class="nav-btn-row">
          <button id="prev-btn" class="nav-btn" style="background:#334155; display:none;" onclick="prevQuestion()">← Previous</button>
          <button id="next-btn" class="nav-btn" style="display:none;" onclick="nextQuestion()">Next Question →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unknownuniversem-blip.github.io/network.js" defer></script>
  <script>
    let manifestData = null;
    let currentTier = 'prelims';
    let currentSubject = '';
    let currentChapterObj = null;
    let currentQuestions = [];
    let currentQIdx = 0;

    // Fetch manifest index on boot
    fetch('data/manifest.json')
      .then(res => res.json())
      .then(data => {
        manifestData = data;
        setTier('prelims');
      })
      .catch(err => {
        document.getElementById('q-text').innerText = "Failed to load syllabus index. Please refresh.";
      });

    function setTier(tier) {
      currentTier = tier;
      document.getElementById('btn-pre').classList.toggle('active', tier === 'prelims');
      document.getElementById('btn-mains').classList.toggle('active', tier === 'mains');
      
      const subjects = Object.keys(manifestData[currentTier]);
      currentSubject = subjects[0];
      renderSubjects();
    }

    function renderSubjects() {
      const subContainer = document.getElementById('subject-list');
      subContainer.innerHTML = '';
      const subjects = Object.keys(manifestData[currentTier]);

      subjects.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn' + (sub === currentSubject ? ' active' : '');
        btn.innerText = sub;
        btn.onclick = () => {
          currentSubject = sub;
          renderSubjects();
        };
        subContainer.appendChild(btn);
      });

      renderChapters();
    }

    function renderChapters() {
      const chContainer = document.getElementById('chapter-list');
      chContainer.innerHTML = '';
      const chapters = manifestData[currentTier][currentSubject] || [];
      
      currentChapterObj = chapters[0] || null;

      chapters.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn' + (currentChapterObj && ch.chapter === currentChapterObj.chapter ? ' active' : '');
        btn.innerText = ch.chapter;
        btn.onclick = () => {
          currentChapterObj = ch;
          document.querySelectorAll('#chapter-list .pill-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadChapterFile(ch.file);
        };
        chContainer.appendChild(btn);
      });

      if (currentChapterObj) {
        loadChapterFile(currentChapterObj.file);
      }
    }

    function loadChapterFile(filePath) {
      document.getElementById('content-area').innerHTML = '<div class="loader">⚡ Loading chapter questions...</div>';
      
      fetch(filePath)
        .then(res => res.json())
        .then(data => {
          currentQuestions = data;
          currentQIdx = 0;
          restoreContentDOM();
          buildJumpDropdown();
          loadQuestion();
        })
        .catch(err => {
          document.getElementById('content-area').innerHTML = '<div class="loader" style="color:#f87171">Failed to load questions. Please check connection.</div>';
        });
    }

    function restoreContentDOM() {
      document.getElementById('content-area').innerHTML = `
        <div id="q-text" class="q-title"></div>
        <div id="options-container"></div>
        <div id="feedback" class="feedback"></div>
        <div class="nav-btn-row">
          <button id="prev-btn" class="nav-btn" style="background:#334155; display:none;" onclick="prevQuestion()">← Previous</button>
          <button id="next-btn" class="nav-btn" style="display:none;" onclick="nextQuestion()">Next Question →</button>
        </div>
      `;
    }

    function buildJumpDropdown() {
      const sel = document.getElementById('jump-select');
      sel.innerHTML = '';
      for (let i = 0; i < currentQuestions.length; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `Q ${i + 1}`;
        sel.appendChild(opt);
      }
    }

    function jumpToQuestion(val) {
      currentQIdx = parseInt(val, 10);
      loadQuestion();
    }

    function loadQuestion() {
      const item = currentQuestions[currentQIdx];
      document.getElementById('feedback').innerText = '';
      document.getElementById('prev-btn').style.display = currentQIdx > 0 ? 'block' : 'none';
      document.getElementById('next-btn').style.display = 'none';

      if (!item) return;

      document.getElementById('exam-name').innerText = item.exam;
      document.getElementById('exam-year').innerText = item.year;
      document.getElementById('q-counter').innerText = `Q ${currentQIdx + 1} of ${currentQuestions.length}`;
      document.getElementById('jump-select').value = currentQIdx;
      document.getElementById('q-text').innerText = `${currentQIdx + 1}. ${item.q}`;

      const optsBox = document.getElementById('options-container');
      optsBox.innerHTML = '';

      item.opts.forEach((opt, idx) => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = opt;
        b.onclick = () => handleAnswer(idx);
        optsBox.appendChild(b);
      });
    }

    function handleAnswer(selected) {
      const item = currentQuestions[currentQIdx];
      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      const fb = document.getElementById('feedback');

      if (selected === item.ans) {
        fb.className = 'feedback correct';
        fb.innerText = "✔ Correct! " + item.exp;
      } else {
        fb.className = 'feedback incorrect';
        fb.innerText = "✖ Incorrect. " + item.exp;
      }

      if (currentQIdx < currentQuestions.length - 1) {
        document.getElementById('next-btn').style.display = 'block';
      }
    }

    function nextQuestion() {
      if (currentQIdx < currentQuestions.length - 1) {
        currentQIdx++;
        loadQuestion();
      }
    }

    function prevQuestion() {
      if (currentQIdx > 0) {
        currentQIdx--;
        loadQuestion();
      }
    }
  </script>
</body>
</html>
