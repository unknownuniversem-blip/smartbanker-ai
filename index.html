<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBanker AI — 5-Year Chapterwise PYQ Bank (2021–2026)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070c18;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px 80px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 26px;
      max-width: 860px;
      width: 100%;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 1.65rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tier-toggle {
      display: flex;
      background: #070c18;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }
    .tier-btn {
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tier-btn.active {
      background: #0284c7;
      color: #fff;
    }
    .scroll-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 12px;
      scrollbar-width: thin;
    }
    .pill-btn {
      white-space: nowrap;
      padding: 7px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .pill-btn:hover { border-color: #38bdf8; }
    .pill-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }
    .chapter-bar .pill-btn.active {
      background: #38bdf8;
      color: #070c18;
      font-weight: 700;
    }
    .quiz-box {
      background: #131d35;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 22px;
      position: relative;
      margin-top: 8px;
    }
    .meta-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .exam-tag {
      background: #b91c1c;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .exam-tag .exam-year {
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 7px;
      border-radius: 4px;
      color: #facc15;
    }
    .q-counter {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .q-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f8fafc;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .opt-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      margin-bottom: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.94rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .opt-btn:hover:not(:disabled) {
      background: #27354f;
      border-color: #38bdf8;
    }
    .feedback {
      min-height: 24px;
      font-size: 0.92rem;
      font-weight: 600;
      margin-top: 14px;
      line-height: 1.45;
    }
    .correct { color: #4ade80; }
    .incorrect { color: #f87171; }
    .nav-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .nav-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .nav-btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <h1>🏦 SmartBanker AI</h1>
      <div class="tier-toggle">
        <button class="tier-btn active" id="btn-pre" onclick="setTier('pre')">Prelims</button>
        <button class="tier-btn" id="btn-mains" onclick="setTier('mains')">Mains</button>
      </div>
    </div>

    <!-- Subject Switcher -->
    <div class="scroll-row" id="subject-list"></div>

    <!-- Chapter Switcher -->
    <div class="scroll-row chapter-bar" id="chapter-list"></div>

    <div class="quiz-box">
      <div class="meta-top-bar">
        <div class="exam-tag" id="exam-tag">
          <span id="exam-name">IBPS PO</span>
          <span class="exam-year" id="exam-year">2025</span>
        </div>
        <div class="q-counter" id="q-counter">Question 1 of 1</div>
      </div>

      <div id="q-text" class="q-title">Loading Question...</div>
      <div id="options-container"></div>
      <div id="feedback" class="feedback"></div>
      <div class="nav-btn-row">
        <button id="prev-btn" class="nav-btn" style="background:#334155; display:none;" onclick="prevQuestion()">← Previous</button>
        <button id="next-btn" class="nav-btn" style="display:none;" onclick="nextQuestion()">Next Question →</button>
      </div>
    </div>
  </div>

  <script src="https://unknownuniversem-blip.github.io/network.js" defer></script>
  <script>
    const CHAPTER_DATA = {
      pre: {
        "Quant (Aptitude)": {
          "Speed, Time & Distance": [
            {
              exam: "IBPS PO Prelims",
              year: "2025",
              q: "A 240 m train crosses a 480 m long platform in 36 seconds. What is the speed of the train in km/h?",
              opts: ["64 km/h", "72 km/h", "80 km/h", "90 km/h"],
              ans: 1,
              exp: "Total Distance = 240 + 480 = 720 m. Speed = 720 / 36 = 20 m/s. In km/h = 20 * (18/5) = 72 km/h."

            {
              exam: "SBI PO Prelims",
              year: "2024",
              q: "A boat covers 28 km downstream in 2 hours and 18 km upstream in 3 hours. Find the speed of the current.",
              opts: ["3 km/h", "4 km/h", "5 km/h", "6 km/h"],
              ans: 1,

            },
            {
              exam: "IBPS RRB PO Prelims",
              year: "2023",
              q: "Two trains of length 150m and 170m run in opposite directions at 42 km/h and 30 km/h respectively. In how many seconds will they cross each other?",
              opts: ["14 sec", "16 sec", "18 sec", "20 sec"],

              exp: "Relative speed = 42 + 30 = 72 km/h = 72 * (5/18) = 20 m/s. Total distance = 150 + 170 = 320 m. Time = 320 / 20 = 16 seconds."

            {
              exam: "SBI Clerk Prelims",

              q: "A man covers 300 km partly by train and partly by car. If he travels 60 km by train and rest by car, it takes 4 hours. If he travels 100 km by train and rest by car, it takes 4 hrs 10 min. Find speed of train.",
              opts: ["50 km/h", "60 km/h", "75 km/h", "80 km/h"],
              ans: 1,
              exp: "Let train speed = x, car = y. 60/x + 240/y = 4 and 100/x + 200/y = 25/6. Solving gives x = 60 km/h."
            },
            {
              exam: "IBPS PO Prelims",
              year: "2021",
              q: "A car travels at 60 km/h for the first half of distance and at 40 km/h for the second half. What is the average speed?",
              opts: ["48 km/h", "50 km/h", "52 km/h", "45 km/h"],
              ans: 0,
              exp: "Harmonic mean: Average speed = (2 * 60 * 40) / (60 + 40) = 4800 / 100 = 48 km/h."
            }
          ],
          "Number Series": [
            {
              exam: "IBPS PO Prelims",

            {
              exam: "SBI PO Prelims",
              year: "2024",

            },
            {
              exam: "IBPS Clerk Prelims",
              year: "2023",
              q: "Find the missing term: 10, 18, 34, ?, 130, 258",
              opts: ["64", "66", "68", "72"],
              ans: 1,

            },
            {
              exam: "SBI Clerk Prelims",
              year: "2022",
              q: "Find the missing term: 15, 8, 9, 15, 32, ?",
              opts: ["77.5", "82.5", "80", "84"],
              ans: 1,

            {
              exam: "IBPS RRB PO Prelims",
              year: "2021",
              q: "Find the missing term: 4, 11, 30, 67, 128, ?",
              opts: ["216", "219", "222", "225"],
              ans: 1,

          ],
          "Profit & Loss": [
            {
              exam: "IBPS PO Prelims",
              year: "2025",
              q: "An article is sold at 15% discount for ₹1,700. Had it been sold without discount, the profit would be 25%. What is CP?",
              opts: ["₹1,500", "₹1,600", "₹1,450", "₹1,550"],
              ans: 1,
              exp: "MP = 1700 / 0.85 = ₹2000. Without discount SP = MP = 2000 with 25% profit. CP = 2000 / 1.25 = ₹1600."
            },
            {
              exam: "SBI PO Prelims",
              year: "2023",
              q: "Cost price of 16 articles equals selling price of 12 articles. What is the gain percentage?",
              opts: ["25%", "33.33%", "30%", "20%"],
              ans: 1,
              exp: "16 CP = 12 SP -> SP/CP = 16/12 = 4/3. Gain = (4-3)/3 = 1/3 = 33.33%."
            },
            {
              exam: "IBPS Clerk Prelims",
              year: "2022",
              q: "A dishonest shopkeeper promises to sell goods at CP but uses an 800g weight instead of 1 kg. Find his gain %.",
              opts: ["20%", "25%", "15%", "22.5%"],

            }
          ]
        },
        "Reasoning Ability": {
          "Syllogism": [
            {
              exam: "IBPS PO Prelims",

              q: "Statements: Only a few Banks are Vaults. All Vaults are Lockers. No Locker is Safe. Conclusions: I. Some Banks can never be Safe. II. All Lockers being Banks is a possibility.",

            },
            {
              exam: "IBPS RRB PO Prelims",
              year: "2023",
              q: "Statements: All Keys are Locks. Some Locks are Doors. No Door is Window. Conclusions: I. Some Locks are not Windows. II. All Doors being Keys is a possibility.",
              opts: ["Only I follows", "Only II follows", "Both I and II follow", "Neither follows"],
              ans: 2,
              exp: "Locks overlapping with Doors cannot be Windows (I follows). Doors can overlap with Keys without restriction (II follows)."
            }
          ],
          "Inequalities": [
            {
              exam: "SBI Clerk Prelims",
              year: "2025",
              q: "Statements: A ≥ B > C = D ≤ E < F; Conclusions: I. A > D  II. F > D",

              exp: "A ≥ B > C = D leads directly to A > D. D ≤ E < F leads to D < F (or F > D). Both follow."
            },
            {
              exam: "IBPS PO Prelims",
              year: "2022",
              q: "Statements: M < N ≤ O = P; Q ≥ P > R; Conclusions: I. Q > M  II. N ≤ R",
              opts: ["Only I follows", "Only II follows", "Both I and II follow", "Neither follows"],
              ans: 0,
              exp: "Q ≥ P = O ≥ N > M gives Q > M (Definite). P > R while N ≤ P doesn't prove N ≤ R. Only I follows."
            }
          ]
        },
        "English Language": {
          "Error Detection": [
            {
              exam: "IBPS PO Prelims",
              year: "2025",
              q: "Find the error part: 'Not only the managing director (A) but also all board members (B) was in favor of (C) the capital expansion (D).'",
              opts: ["(A)", "(B)", "(C)", "(D)"],
              ans: 2,
              exp: "In 'not only...but also', the verb agrees with the closer subject. 'Board members' is plural, so it must be 'were in favor of'."
            },
            {
              exam: "SBI PO Prelims",
              year: "2024",
              q: "Find the error part: 'Scarcely had the bank manager (A) entered the vault (B) than the alarm system (C) went off unexpectedly (D).'",
              opts: ["(A)", "(B)", "(C)", "(D)"],
              ans: 2,
              exp: "'Scarcely...when' is the correct correlative pair, not 'than' (which pairs with 'No sooner')."
            },
            {
              exam: "IBPS Clerk Prelims",
              year: "2023",
              q: "Find the error part: 'Each of the loan applicants (A) have submitted their (B) KYC documentation (C) to the nodal branch (D).'",
              opts: ["(A)", "(B)", "(C)", "(D)"],
              ans: 1,
              exp: "'Each' takes a singular verb: 'has submitted his/her KYC documentation'."
            }
          ]
        }
      },
      mains: {
        "General / Banking Awareness": {
          "Monetary Policy & Central Banking": [
            {
              exam: "IBPS PO Mains",
              year: "2025",
              q: "Under the Reserve Bank of India Standing Deposit Facility (SDF), what collateral does the RBI provide to commercial banks?",
              opts: ["Government Securities", "Treasury Bills", "No collateral required", "State Development Loans"],
              ans: 2,
              exp: "SDF is an uncollateralized liquidity absorption mechanism introduced by the RBI to absorb surplus liquidity without pledging G-Secs."
            },
            {
              exam: "SBI PO Mains",
              year: "2024",
              q: "What is the penalty interest rate charged by the RBI on shortfall in Cash Reserve Ratio (CRR) for subsequent days of default?",
              opts: ["Bank Rate + 2%", "Bank Rate + 3%", "Bank Rate + 5%", "Repo Rate + 4%"],
              ans: 2,
              exp: "RBI mandates Bank Rate + 3% for day 1 shortfall, and Bank Rate + 5% for subsequent consecutive days of default."
            },
            {
              exam: "IBPS PO Mains",
              year: "2023",
              q: "Under Basel III capital adequacy guidelines, what is the minimum Common Equity Tier 1 (CET1) ratio mandated for Indian banks by RBI?",
              opts: ["4.5%", "5.5%", "7.0%", "8.0%"],

              exp: "RBI prescribes a minimum CET1 ratio of 5.5% of risk-weighted assets (stricter than Basel's global 4.5% standard)."
            },
            {
              exam: "SBI PO Mains",
              year: "2022",
              q: "What is the upper limit on an individual transaction using UPI 123Pay for feature phone users?",
              opts: ["₹2,000", "₹5,000", "₹10,000", "₹1,000"],
              ans: 2,
              exp: "RBI enhanced the per-transaction limit for UPI 123Pay to ₹10,000 to promote rural digital financial inclusion."
            },
            {
              exam: "IBPS PO Mains",

              q: "Which regulatory body regulates the Credit Information Companies (like CIBIL, Experian, CRIF High Mark) in India?",

              exp: "RBI licenses and regulates all Credit Information Companies under the Credit Information Companies (Regulation) Act, 2005."

          "Priority Sector Lending & Schemes": [
            {
              exam: "IBPS PO Mains",
              year: "2025",
              q: "What is the Priority Sector Lending (PSL) target for Primary (Urban) Co-operative Banks (UCBs) to be achieved by March 31, 2026?",
              opts: ["40%", "60%", "75%", "50%"],

            },
            {
              exam: "SBI PO Mains",
              year: "2024",
              q: "Under the PM SVANidhi scheme, what is the maximum loan limit in the 3rd tranche for urban street vendors?",

        },
        "Data Analysis & Interpretation": {
          "Caselet & Radar DI": [
            {
              exam: "IBPS PO Mains",
              year: "2024",
              q: "In an asset reconstruction portfolio of ₹2,400 Cr, 35% is recovered in cash, 40% via Security Receipts (SRs), and the rest written off. What is the written-off value?",

              exp: "Resolved % = 35% + 40% = 75%. Remaining write-off = 25% of ₹2,400 Cr = ₹600 Cr."
            },
            {
              exam: "SBI PO Mains",
              year: "2023",
              q: "Ratio of NPA recovery in Branch A vs Branch B is 3:5. If total NPAs were ₹800 Cr and total recovery rate was 60%, find recovery in Branch B (assuming equal initial allocation).",
              opts: ["₹250 Cr", "₹300 Cr", "₹320 Cr", "₹280 Cr"],

              exp: "Total recovery = 60% of 800 = 480 Cr. Allocated in ratio 3:5 -> Branch B = (5/8) * 480 = ₹300 Cr."

          ]
        },
        "Computer Aptitude": {
          "Networking & Banking IT": [
            {
              exam: "IBPS PO Mains",
              year: "2025",

            },

              exam: "IBPS RRB PO Mains",
              year: "2024",

              opts: ["Tyupkin", "Stuxnet", "WannaCry", "Mirai"],

          ]

      }
    };

    let currentTier = 'pre';
    let currentSubject = '';
    let currentChapter = '';
    let currentQIdx = 0;

    function setTier(tier) {
      currentTier = tier;
      document.getElementById('btn-pre').classList.toggle('active', tier === 'pre');
      document.getElementById('btn-mains').classList.toggle('active', tier === 'mains');
      
      const subjects = Object.keys(CHAPTER_DATA[currentTier]);
      currentSubject = subjects[0];
      renderSubjects();
    }

    function renderSubjects() {
      const subContainer = document.getElementById('subject-list');
      subContainer.innerHTML = '';
      const subjects = Object.keys(CHAPTER_DATA[currentTier]);

      subjects.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn' + (sub === currentSubject ? ' active' : '');
        btn.innerText = sub;
        btn.onclick = () => {
          currentSubject = sub;
          renderSubjects();
        };
        subContainer.appendChild(btn);
      });

      renderChapters();
    }

    function renderChapters() {
      const chContainer = document.getElementById('chapter-list');
      chContainer.innerHTML = '';
      const chapters = Object.keys(CHAPTER_DATA[currentTier][currentSubject] || {});
      
      if (chapters.length > 0) {
        currentChapter = chapters[0];
      } else {
        currentChapter = '';
      }

      chapters.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn' + (ch === currentChapter ? ' active' : '');
        btn.innerText = ch;
        btn.onclick = () => {
          currentChapter = ch;
          document.querySelectorAll('#chapter-list .pill-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentQIdx = 0;
          loadQuestion();
        };
        chContainer.appendChild(btn);
      });

      currentQIdx = 0;
      loadQuestion();
    }

    function loadQuestion() {
      const qList = (CHAPTER_DATA[currentTier][currentSubject] && CHAPTER_DATA[currentTier][currentSubject][currentChapter]) || [];
      const item = qList[currentQIdx];

      document.getElementById('feedback').innerText = '';
      document.getElementById('prev-btn').style.display = currentQIdx > 0 ? 'block' : 'none';
      document.getElementById('next-btn').style.display = 'none';

      if (!item) {
        document.getElementById('exam-name').innerText = "ARCHIVE";
        document.getElementById('exam-year').innerText = "2025";
        document.getElementById('q-counter').innerText = "0 of 0";
        document.getElementById('q-text').innerText = "Select a valid chapter from above.";
        document.getElementById('options-container').innerHTML = '';
        return;
      }

      document.getElementById('exam-name').innerText = item.exam;
      document.getElementById('exam-year').innerText = item.year;
      document.getElementById('q-counter').innerText = `Question ${currentQIdx + 1} of ${qList.length}`;
      document.getElementById('q-text').innerText = item.q;

      const optsBox = document.getElementById('options-container');
      optsBox.innerHTML = '';

      item.opts.forEach((opt, idx) => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = opt;
        b.onclick = () => handleAnswer(idx);
        optsBox.appendChild(b);
      });
    }

    function handleAnswer(selected) {
      const qList = CHAPTER_DATA[currentTier][currentSubject][currentChapter];
      const item = qList[currentQIdx];
      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      const fb = document.getElementById('feedback');

      if (selected === item.ans) {
        fb.className = 'feedback correct';
        fb.innerText = "✔ Correct! " + item.exp;
      } else {
        fb.className = 'feedback incorrect';
        fb.innerText = "✖ Incorrect. Solution: " + item.exp;
      }

      if (currentQIdx < qList.length - 1) {
        document.getElementById('next-btn').style.display = 'block';
      }
    }

    function nextQuestion() {
      currentQIdx++;
      loadQuestion();
    }

    function prevQuestion() {
      if (currentQIdx > 0) {
        currentQIdx--;
        loadQuestion();
      }
    }

    setTier('pre');
  </script>
</body>
</html>
