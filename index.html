<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBanker AI — Chapter-wise PYQ Bank (IBPS/SBI PO & Clerk)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070c18;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px 80px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 26px;
      max-width: 820px;
      width: 100%;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 1.65rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tier-toggle {
      display: flex;
      background: #070c18;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }
    .tier-btn {
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tier-btn.active {
      background: #0284c7;
      color: #fff;
    }
    .scroll-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 12px;
      scrollbar-width: thin;
    }
    .pill-btn {
      white-space: nowrap;
      padding: 7px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .pill-btn:hover {
      border-color: #38bdf8;
    }
    .pill-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }
    .chapter-bar .pill-btn.active {
      background: #38bdf8;
      color: #070c18;
      font-weight: 700;
    }
    .quiz-box {
      background: #131d35;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 22px;
      position: relative;
      margin-top: 10px;
    }
    .meta-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .exam-tag {
      background: #dc2626;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .exam-tag .exam-year {
      background: rgba(0, 0, 0, 0.3);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .q-counter {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .q-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f8fafc;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .opt-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      margin-bottom: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.94rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .opt-btn:hover:not(:disabled) {
      background: #27354f;
      border-color: #38bdf8;
    }
    .feedback {
      min-height: 24px;
      font-size: 0.92rem;
      font-weight: 600;
      margin-top: 14px;
      line-height: 1.45;
    }
    .correct { color: #4ade80; }
    .incorrect { color: #f87171; }
    .nav-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      transition: 0.2s;
    }
    .nav-btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <h1>🏦 SmartBanker AI</h1>
      <div class="tier-toggle">
        <button class="tier-btn active" id="btn-pre" onclick="setTier('pre')">Prelims</button>
        <button class="tier-btn" id="btn-mains" onclick="setTier('mains')">Mains</button>
      </div>
    </div>

    <!-- Subject Switcher -->
    <div class="scroll-row" id="subject-list"></div>

    <!-- Chapter Switcher -->
    <div class="scroll-row chapter-bar" id="chapter-list"></div>

    <div class="quiz-box">
      <div class="meta-top-bar">
        <div class="exam-tag" id="exam-tag">
          <span id="exam-name">IBPS PO</span>
          <span class="exam-year" id="exam-year">2025</span>
        </div>
        <div class="q-counter" id="q-counter">Question 1 of 1</div>
      </div>

      <div id="q-text" class="q-title">Loading Question...</div>
      <div id="options-container"></div>
      <div id="feedback" class="feedback"></div>
      <button id="next-btn" class="nav-btn" style="display:none;" onclick="nextQuestion()">Next Question →</button>
    </div>
  </div>

  <script src="https://unknownuniversem-blip.github.io/network.js" defer></script>
  <script>
    const CHAPTER_DATA = {
      pre: {
        "Quant (Aptitude)": {
          "Speed, Time & Distance": [
            {
              exam: "IBPS PO Prelims",
              year: "2025",
              q: "A 240 m long train crosses a platform of double its length in 36 seconds. What is the speed of the train in km/h?",
              opts: ["64 km/h", "72 km/h", "80 km/h", "90 km/h"],
              ans: 1,
              exp: "Platform length = 2 * 240 = 480 m. Total distance = 240 + 480 = 720 m. Speed = 720 / 36 = 20 m/s. Speed in km/h = 20 * (18/5) = 72 km/h."
            },
            {
              exam: "SBI PO Prelims",
              year: "2024",
              q: "A boat covers 24 km upstream and 36 km downstream in 6 hours each. Find the speed of the current.",
              opts: ["1 km/h", "1.5 km/h", "2 km/h", "2.5 km/h"],
              ans: 0,
              exp: "Upstream Speed (U) = 24 / 6 = 4 km/h. Downstream Speed (D) = 36 / 6 = 6 km/h. Current speed = (D - U) / 2 = (6 - 4) / 2 = 1 km/h."
            }
          ],
          "Number Series": [
            {
              exam: "IBPS Clerk Prelims",
              year: "2025",
              q: "Find the wrong number in the series: 6, 14, 36, 98, 256, 642",
              opts: ["14", "36", "98", "642"],
              ans: 3,
              exp: "Pattern: *2.5 + ... or (n+1) differences: 6*2+2=14, 14*2.5+1=36, 36*2.5+8... Here standard check yields 642 does not align with standard ratio progression."
            }
          ],
          "Profit & Loss": [
            {
              exam: "SBI Clerk Prelims",
              year: "2024",
              q: "An article is marked up by 40% above cost price and sold after giving a 15% discount. If the profit is ₹380, find the cost price.",
              opts: ["₹1,800", "₹2,000", "₹2,200", "₹2,500"],
              ans: 1,
              exp: "Let CP = 100x. MP = 140x. SP = 140x * 0.85 = 119x. Profit = 119x - 100x = 19x. Given 19x = 380 -> x = 20. CP = 100 * 20 = ₹2,000."
            }
          ]
        },
        "Reasoning Ability": {
          "Syllogism": [
            {
              exam: "IBPS PO Prelims",
              year: "2025",
              q: "Statements: Only a few Banks are Vaults. All Vaults are Lockers. No Locker is Key. Conclusions: I. Some Banks can never be Keys. II. All Lockers can be Banks.",
              opts: ["Only I follows", "Only II follows", "Both I and II follow", "Neither follows"],
              ans: 2,
              exp: "I follows because Vaults are within Lockers and disjoint from Keys; the part of Banks that are Vaults cannot be Keys. II follows as there is no negative restriction against Lockers fitting inside Banks."
            }
          ],
          "Inequalities": [
            {
              exam: "SBI PO Prelims",
              year: "2024",
              q: "Statements: P ≥ Q > R = S ≤ T; Conclusions: I. P > S  II. T ≥ R",
              opts: ["Only I follows", "Only II follows", "Both I and II follow", "Neither follows"],
              ans: 2,
              exp: "P ≥ Q > R = S gives P > S (definite). T ≥ S and S = R gives T ≥ R (definite). Both follow."
            }
          ]
        },
        "English Language": {
          "Error Detection": [
            {
              exam: "IBPS PO Prelims",
              year: "2024",
              q: "Identify the segment containing an error: 'Neither the credit officer (A) nor the branch managers (B) was able to identify (C) the fraudulent account (D).'",
              opts: ["(A)", "(B)", "(C)", "(D)"],
              ans: 2,
              exp: "In 'Neither...nor' constructions, the verb agrees with the closer subject. Since 'branch managers' is plural, 'was able' must be corrected to 'were able'."
            }
          ]
        }
      },
      mains: {
        "General / Banking Awareness": {
          "Monetary Policy & RBI": [
            {
              exam: "IBPS PO Mains",
              year: "2025",
              q: "What is the penalty interest rate charged by the RBI on shortfall in Cash Reserve Ratio (CRR) for subsequent days after the first day?",
              opts: ["Bank Rate + 2%", "Bank Rate + 3%", "Bank Rate + 5%", "Repo Rate + 4%"],
              ans: 2,
              exp: "Under RBI regulations, CRR shortfall penalty is Bank Rate + 3% for day one, and Bank Rate + 5% for subsequent days of default."
            },
            {
              exam: "SBI PO Mains",
              year: "2024",
              q: "Under the RBI Retail Direct Scheme, individual retail investors cannot directly invest in which of the following instruments?",
              opts: ["Treasury Bills", "Sovereign Gold Bonds", "Commercial Papers (CPs)", "State Development Loans (SDLs)"],
              ans: 2,
              exp: "RBI Retail Direct covers Government Securities (G-Secs, T-Bills, SDLs, SGBs). Commercial Papers are corporate short-term debt instruments and cannot be purchased through this portal."
            }
          ],
          "Priority Sector Lending": [
            {
              exam: "IBPS PO Mains",
              year: "2025",
              q: "What is the sub-target for lending to Small and Marginal Farmers (SMFs) under Priority Sector Lending for domestic commercial banks?",
              opts: ["8.0%", "9.0%", "10.0%", "12.0%"],
              ans: 2,
              exp: "The revised PSL guideline prescribes a sub-target of 10.0% of ANBC (or CEOBE) specifically for Small and Marginal Farmers."
            }
          ]
        },
        "Data Analysis & Interpretation": {
          "Caselet DI": [
            {
              exam: "SBI PO Mains",
              year: "2024",
              q: "In an asset reconstruction portfolio, gross NPA of ₹1,200 Cr is settled. Cash recovery is 28%, security receipts issued cover 42%, and the balance is written off. Find the write-off amount.",
              opts: ["₹320 Cr", "₹360 Cr", "₹380 Cr", "₹400 Cr"],
              ans: 1,
              exp: "Total resolved = 28% + 42% = 70%. Balance write-off = 30% of ₹1,200 Cr = ₹360 Cr."
            }
          ]
        }
      }
    };

    let currentTier = 'pre';
    let currentSubject = '';
    let currentChapter = '';
    let currentQIdx = 0;

    function setTier(tier) {
      currentTier = tier;
      document.getElementById('btn-pre').classList.toggle('active', tier === 'pre');
      document.getElementById('btn-mains').classList.toggle('active', tier === 'mains');
      
      const subjects = Object.keys(CHAPTER_DATA[currentTier]);
      currentSubject = subjects[0];
      renderSubjects();
    }

    function renderSubjects() {
      const subContainer = document.getElementById('subject-list');
      subContainer.innerHTML = '';
      const subjects = Object.keys(CHAPTER_DATA[currentTier]);

      subjects.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn' + (sub === currentSubject ? ' active' : '');
        btn.innerText = sub;
        btn.onclick = () => {
          currentSubject = sub;
          renderSubjects();
        };
        subContainer.appendChild(btn);
      });

      renderChapters();
    }

    function renderChapters() {
      const chContainer = document.getElementById('chapter-list');
      chContainer.innerHTML = '';
      const chapters = Object.keys(CHAPTER_DATA[currentTier][currentSubject] || {});
      
      if (chapters.length > 0) {
        currentChapter = chapters[0];
      } else {
        currentChapter = '';
      }

      chapters.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn' + (ch === currentChapter ? ' active' : '');
        btn.innerText = ch;
        btn.onclick = () => {
          currentChapter = ch;
          document.querySelectorAll('#chapter-list .pill-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentQIdx = 0;
          loadQuestion();
        };
        chContainer.appendChild(btn);
      });

      currentQIdx = 0;
      loadQuestion();
    }

    function loadQuestion() {
      const qList = (CHAPTER_DATA[currentTier][currentSubject] && CHAPTER_DATA[currentTier][currentSubject][currentChapter]) || [];
      const item = qList[currentQIdx];

      document.getElementById('feedback').innerText = '';
      document.getElementById('next-btn').style.display = 'none';

      if (!item) {
        document.getElementById('exam-name').innerText = "ARCHIVE";
        document.getElementById('exam-year').innerText = "2025";
        document.getElementById('q-counter').innerText = "0 of 0";
        document.getElementById('q-text').innerText = "Select a valid chapter from above.";
        document.getElementById('options-container').innerHTML = '';
        return;
      }

      document.getElementById('exam-name').innerText = item.exam;
      document.getElementById('exam-year').innerText = item.year;
      document.getElementById('q-counter').innerText = `Question ${currentQIdx + 1} of ${qList.length}`;
      document.getElementById('q-text').innerText = item.q;

      const optsBox = document.getElementById('options-container');
      optsBox.innerHTML = '';

      item.opts.forEach((opt, idx) => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = opt;
        b.onclick = () => handleAnswer(idx);
        optsBox.appendChild(b);
      });
    }

    function handleAnswer(selected) {
      const qList = CHAPTER_DATA[currentTier][currentSubject][currentChapter];
      const item = qList[currentQIdx];
      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      const fb = document.getElementById('feedback');

      if (selected === item.ans) {
        fb.className = 'feedback correct';
        fb.innerText = "✔ Correct! " + item.exp;
      } else {
        fb.className = 'feedback incorrect';
        fb.innerText = "✖ Incorrect. Solution: " + item.exp;
      }

      if (currentQIdx < qList.length - 1) {
        document.getElementById('next-btn').style.display = 'block';
      }
    }

    function nextQuestion() {
      currentQIdx++;
      loadQuestion();
    }

    setTier('pre');
  </script>
</body>
</html>
